name: Actualizare Zilnica VOD
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python curatavod.py
      - run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Action"
          git add doar_filme_seriale.m3u
          git commit -m "Actualizare zilnica" || exit 0
          git push
